[package]
name = "rusty-web-tetris"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# Dependencies that apply to ALL targets go here.
wasm-bindgen = "0.2.126"

# ------------------------------------------------------------------
# Wasm-only dependencies
# ------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. 
console_error_panic_hook = { version = "0.1.7", optional = true }

# `wee_alloc` is a tiny allocator for wasm that is only ~1K in code size.
wee_alloc = { version = "0.4.5", optional = true }

# web-sys inline declaration
web-sys = { version = "0.3.103", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window"
] }

# ------------------------------------------------------------------
# Native-only (non-Wasm) dependencies
# ------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.10.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"