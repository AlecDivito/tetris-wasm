<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="utf-8" />
        <link rel="stylesheet" type="text/css" href="./bootstrap.css" />
        <title>Tetris With Wasm</title>
    </head>
    <body>
        <!-- Main Menu page
      Ability to access:
        - (required) Play Game Page (use defaults)
        - (optional) Select Game Mode Page
        - (optional) Controls Page 
        - (optional) Stats? idk
    -->
        <div id="main-menu-page" class="main-menu">
            <div class="hero">
                <h2 class="main-menu__subtitle">STACK, CLEAR, REPEAT</h2>
                <h1 class="main-menu__title">
                    <span class="main-menu__title__letter t1">T</span>
                    <span class="main-menu__title__letter e">e</span>
                    <span class="main-menu__title__letter t2">t</span>
                    <span class="main-menu__title__letter r">r</span>
                    <span class="main-menu__title__letter i">i</span>
                    <span class="main-menu__title__letter s">s</span>
                </h1>
            </div>
            <div class="flex column gap-4">
                <button id="main-menu-play">Play</button>
                <button id="main-menu-custom-game">Custom Game</button>
                <button id="main-menu-how-to-play">How to Play</button>
            </div>
        </div>

        <div id="custom-game-page" class="custom-game">
            <h1>Custom Game</h1>
            <!-- Need to include all of the changable settings -->
        </div>

        <div id="how-to-play-modal" class="how-to-play">
            <h1>How to Play</h1>
            <!-- Need to include all of the instructions -->
        </div>

        <!-- Game page
      Ability to:
        - (required) Pause Game (Modal)
        - (required) Lose Game  (Modal)
      Must Show:
        - (required) Holding Piece
        - (required) Next Pieces
        - (required) Level
        - (required) Goal (number of pieces to match to get to next level)
        - (required) Score
        - (required) Pause Button
        - (optional) coins -- this can be done later
      Examples:
        https://www.emmawang.me/ui?lightbox=dataItem-j0idzdxn
        https://www.pinterest.ca/fduy96/tetris-ui/
        http://www.douvilleart.com/new-page-81
    -->
        <div id="game-page" class="game">
            <div class="game__bar">
                <h2>Tetris</h2>
            </div>
            <div class="flex center">
                <div class="game__board">
                    <div
                        id="game__board__item--left"
                        class="game__board__item game__board__item--left flex column gap-4"
                    >
                        <div class="card">
                            <p class="card__title">Hold</p>
                            <div class="card__content flex center">
                                <canvas class="" id="hold_piece"></canvas>
                            </div>
                        </div>
                        <div class="card gap-0">
                            <h3 class="flex row gap-2 between">
                                <span class="label">Score</span>
                                <span class="value" id="score">100000</span>
                            </h3>
                            <h3 class="flex row gap-2 between">
                                <span class="label">level</span>
                                <span class="value" id="level">100000</span>
                            </h3>
                            <h3 class="flex row gap-2 between">
                                <span class="label">Rows</span>
                                <span class="value" id="rows_completed">100000</span>
                            </h3>
                        </div>
                        <button id="game-pause">⏸</button>
                    </div>
                    <div
                        id="game__board__item--main"
                        class="game__board__item game__board__item--main"
                    >
                        <canvas id="tetris"></canvas>
                    </div>
                    <div
                        id="game__board__item--right"
                        class="game__board__item game__board__item--right"
                    >
                        <div class="card">
                            <p class="card__title">Next</p>
                            <div class="card__content flex center">
                                <canvas id="preview"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pause Modal
      Required:
        - Title (Game Pause)
        - Control Music Slider
        - Control Sound Slider
        - Restart Game
        - Close Model
      Examples:
        https://www.pinterest.co.uk/pin/838443655599579811/
    -->
        <div id="pause-game-modal" class="modal card pause">
            <h1 class="card__title">Pause Game</h1>
            <div class="card__content pause__list">
                <button id="pause-game-resume">Resume</button>
                <button id="pause-game-restart">Restart</button>
                <button id="pause-game-control">How to play</button>
                <button id="pause-game-exit">Exit Game</button>
            </div>
        </div>

        <!-- Game Over Modal
      Required:
        - Score Board
          - Name + Number
        - Play Again
        - Share High Score
        - Go To Main Menu
      Examples:
        https://dribbble.com/shots/1216488-Tetris-Game-Over
    -->
        <div id="game-over-modal" class="modal card game-over">
            <h1 class="card__title">Game Over</h1>
            <div class="card__content">
                <h3 class="card__content__title">High Scores</h3>
                <ul class="card__list"></ul>
            </div>
            <button id="game-over-exit">🏠</button>
            <button id="game-over-restart">↺</button>
        </div>

        <script src="./bootstrap.js"></script>
    </body>
</html>
